stages:
  - build
  - test

variables:
  POSTGRES_USER: gitlab_admin
  POSTGRES_PASSWORD: gitlab_password
  POSTGRES_DB: gitlab_db
  PGHOST: db
  SQL_TIMEOUT: 10
  GOCACHE: /go/cache

services:
  - docker:dind

go-build:
  stage: build
  image: golang:1.23.9
  tags:
    - students-buildkit-medium
  script:
    - mkdir -p $GOCACHE
    - go build -v ./go/cmd/auth/auth.go
  cache:
    paths:
      - /go/cache/


test-go:
  stage: test
  image: golang:1.23.9
  tags:
    - students-buildkit-medium
  script:
    - docker-compose up -d bd
    - sleep 20
    - go test -v ./...

