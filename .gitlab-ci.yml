stages:
  - generate
  - build
  - test

variables:
  GOCACHE: $CI_PROJECT_DIR/go/cache

go-build:
  stage: build
  image: golang:1.23.9
  tags:
    - students-buildkit-medium
  script:
    - go mod download
    - go mod tidy
    - mkdir -p $GOCACHE
    - go build -o server ./go/cmd/server

java-build:
  stage: build
  image: gradle:8.14.0-jdk17
  tags:
    - students-buildkit-medium
  script:
    - gradle -p ./java build

java-unit-tests:
  stage: test
  image: gradle:8.14.0-jdk17
  tags:
    - students-buildkit-medium 
  dependencies:
    - java-build
  script:
    - gradle -p ./java test


