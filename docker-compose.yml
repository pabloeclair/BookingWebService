services:
  db:
    image: postgres:latest
    container_name: db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/data

  user-api:
    build: 
      context: .
      target: users
    container_name: user-api
    environment:
      - DSN=${DSN}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_USER_DURATION=${JWT_USER_DURATION}
      - JWT_ADMIN_DURATION=${JWT_USER_DURATION}
    ports:
      - "7070:7070"
    depends_on:
      - db
  
  booking-api:
    build: 
      context: .
      target: web
    container_name: booking-api
    environment:
      - JAVA_SOURCE=${JAVA_SOURCE}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET_KET=${JWT_SECRET_KEY}
    ports:
      - "8080:8080"
    depends_on:
      - user-api

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - booking-api

volumes:
  postgres_data: