services:
  db:
    image: postgres:latest
    container_name: db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/data

  booking_service:
    build: .
    container_name: booking_service
    environment:
      - DSN=${DSN}
      - SQL_TIMEOUT=${SQL_TIMEOUT}
    ports:
      - "5050:5050"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - booking_service

volumes:
  postgres_data: