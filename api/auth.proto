syntax = "proto3";

option go_package = "internal/pb";
option java_package = "com.centraluniversity.booking";
option java_multiple_files = true;

enum Role {
    ADMIN = 0;
    USER = 1;
}

message SignUpRequest {
    string email = 1;
    string first_name = 2;
    string second_name = 3;
    optional string patronymic = 4;
    string password = 5;
}

message SignUpResponse {
    uint32 id = 1;
    Role role = 2;
    string auth_header = 3;
}

message EmailPassword {
    string email = 1;
    string password = 2;
}

message AuthHeader {
    uint32 id = 1;
    string auth_header = 2;
}

message UpdateRequest {
    string email = 1;
    string first_name = 2;
    string second_name = 3;
    optional string patronymic = 4;
}

message Empty {}

service Authentication {
    rpc SignUpUser (SignUpRequest) returns (SignUpResponse);
    rpc LogInUser (EmailPassword) returns (AuthHeader);
    rpc UpdateUser (UpdateRequest) returns (AuthHeader);
    rpc DeleteUser (EmailPassword) returns (Empty);
}