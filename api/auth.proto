syntax = "proto3";

option go_package = "internal/pb";
option java_package = "centraluniversity.app.booking.pb";
option java_multiple_files = true;

enum Role {
    ADMIN = 0;
    USER = 1;
}

message SignupRequest {
    string email = 1;
    string first_name = 2;
    string second_name = 3;
    optional string patronymic = 4;
    string password = 5;
}

message Email {
    string email = 1;
}

message Id {
    uint32 id = 1;
}

message UpdateRequest {
    string email = 1;
    string first_name = 2;
    string second_name = 3;
    optional string patronymic = 4;
    string password = 5;
    string auth_header = 6;
}

message UserResponse {
    uint32 id = 1;
    string email = 2;
    string first_name = 3;
    string second_name = 4;
    optional string patronymic = 5;
    Role role = 6;
    string auth_header = 7;
}

message Empty {}

service Authentication {
    rpc SignupUser (SignupRequest) returns (UserResponse);
    rpc GetUserByEmail (Email) returns (UserResponse);
    rpc GetUserById (Id) returns (UserResponse);
    rpc UpdateUser (UpdateRequest) returns (UserResponse);
    rpc DeleteUser (Email) returns (Empty);
}